<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Shadow / Under-card -->
  <rect x="75" y="115" width="310" height="230" rx="28" fill="#1e1b4b" stroke="#4f46e5" stroke-width="4" transform="rotate(-8 230 230)" opacity="0.6" />
  
  <!-- Main Flashcard (Foreground) -->
  <rect x="100" y="130" width="320" height="240" rx="28" fill="url(#cardGrad)" filter="url(#glow)" />
  
  <!-- Neural / Brain Graphic -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(140, 160)">
    <!-- Left Hemisphere -->
    <path d="M 115 15 C 75 15, 45 45, 45 75 C 45 95, 65 105, 65 115 C 65 125, 45 135, 75 145 C 85 145, 95 135, 115 135 Z" fill="none" opacity="0.9" />
    <!-- Right Hemisphere -->
    <path d="M 115 15 C 155 15, 185 45, 185 75 C 185 95, 165 105, 165 115 C 165 125, 185 135, 155 145 C 145 145, 135 135, 115 135 Z" fill="none" stroke="url(#brainGrad)" />
    
    <!-- Central Connection Line -->
    <line x1="115" y1="15" x2="115" y2="135" stroke="#ffffff" stroke-width="6" opacity="0.7" />
    
    <!-- Connection Nodes (Dots) -->
    <circle cx="115" cy="15" r="8" fill="#06b6d4" stroke="none" />
    <circle cx="45" cy="75" r="8" fill="#ffffff" stroke="none" />
    <circle cx="185" cy="75" r="8" fill="#06b6d4" stroke="none" />
    <circle cx="65" cy="115" r="8" fill="#ffffff" stroke="none" />
    <circle cx="165" cy="115" r="8" fill="#06b6d4" stroke="none" />
    <circle cx="115" cy="135" r="8" fill="#ffffff" stroke="none" />
  </g>
</svg>